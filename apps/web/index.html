<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 24s-4.5-3-6.5-5.6C8 16.4 8.8 13.8 11 12.9c1.5-.6 3 .1 3.8 1.5v0c.8-1.4 2.3-2.1 3.8-1.5 2.2.9 3 3.5 1.5 5.5C20.5 21 16 24 16 24Z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心伴 · AI 心理健康陪伴助手</title>
    <script>
      // 首帧应用主题,避免白屏闪烁
      try {
        var KEY = 'gzhu2-settings'
        var MARK = 'gzhu2-theme-default-light'
        var s = JSON.parse(localStorage.getItem(KEY) || '{}')

        // 旧版本的默认主题是深色,已被写进本地存储。这里一次性迁回浅色,
        // 否则改掉默认值后老用户的界面仍是深色(MARK 之后不再干预用户自己的选择)
        if (!localStorage.getItem(MARK)) {
          s = s || {}
          s.theme = 'light'
          localStorage.setItem(KEY, JSON.stringify(s))
          localStorage.setItem(MARK, '1')
        }

        var theme = s.theme === 'dark' ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
